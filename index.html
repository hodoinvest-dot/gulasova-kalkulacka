<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gulášová Kalkulačka</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C8A55A;
      --gold-light: #DDB96A;
      --dark: #1a1a1a;
      --dark2: #2a2a2a;
      --white: #ffffff;
      --bg: #f0f0ee;
      --card: #ffffff;
      --text: #222222;
      --text-muted: #777;
      --border: #e0ddd8;
      --radius: 14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* ── HEADER ── */
    .header {
      background: var(--dark);
      padding: 32px 20px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(200,165,90,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .header-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(200,165,90,0.4);
      border-radius: 20px;
      padding: 4px 12px;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold);
      text-transform: uppercase;
      line-height: 1.1;
    }
    .header h1 span { color: #fff; }
    .header p {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      margin-top: 8px;
    }

    /* ── STICKY BAR ── */
    .sticky-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: var(--dark2);
      border-bottom: 1px solid rgba(200,165,90,0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      z-index: 200;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }
    .sticky-bar.show { transform: translateY(0); }
    .sticky-name { font-weight: 700; color: #fff; font-size: 14px; }
    .sticky-info { font-size: 13px; color: var(--gold); font-weight: 600; }

    /* ── CONTAINER ── */
    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 14px;
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px 20px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      border-left: 3px solid var(--gold);
      padding-left: 10px;
      margin-bottom: 18px;
    }

    /* ── SEARCH BOX ── */
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #fafaf8;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--gold); background: #fff; }
    .search-input::placeholder { color: var(--text-muted); }

    /* ── CATEGORY TABS ── */
    .cat-tabs {
      display: flex;
      gap: 7px;
      margin-bottom: 14px;
    }
    .cat-tab {
      flex: 1;
      padding: 7px 4px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .cat-tab:hover { border-color: var(--gold); color: var(--text); }
    .cat-tab.active {
      background: var(--dark);
      color: var(--gold);
      border-color: var(--dark);
    }

    /* ── TYPE BUTTONS ── */
    .type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }
    .type-btn {
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 11px 6px 9px;
      text-align: center;
      cursor: pointer;
      background: #fff;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text);
      transition: all 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .type-btn:hover { border-color: var(--gold); background: #fdf9f0; }
    .type-btn.active {
      background: var(--dark);
      color: #fff;
      border-color: var(--gold);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .type-emoji {
      display: block;
      font-size: 22px;
      margin-bottom: 5px;
      line-height: 1;
    }
    .type-btn-cat {
      display: block;
      font-size: 9px;
      letter-spacing: 0.5px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 3px;
      opacity: 0.45;
    }
    .type-btn.active .type-btn-cat { opacity: 0.6; color: var(--gold); }

    /* Prázdny stav */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 24px 10px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .no-results span { display: block; font-size: 28px; margin-bottom: 8px; }

    /* ── SLIDER SECTION ── */
    .guest-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }
    .guest-label {
      font-size: 16px;
      font-weight: 700;
    }
    .guest-display {
      font-size: 38px;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      background: linear-gradient(
        to right,
        var(--dark) 0%,
        var(--dark) var(--fill, 9.4%),
        #ddd var(--fill, 9.4%),
        #ddd 100%
      );
      margin-bottom: 14px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--dark);
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--dark);
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      cursor: pointer;
    }
    .guest-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .counter-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 2px solid var(--dark);
      background: #fff;
      font-size: 22px;
      line-height: 1;
      font-weight: 300;
      color: var(--dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .counter-btn:hover, .counter-btn:active {
      background: var(--dark); color: #fff;
    }
    .guest-num-input {
      flex: 1;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      outline: none;
      font-family: inherit;
      color: var(--text);
      transition: border-color 0.15s;
    }
    .guest-num-input:focus { border-color: var(--gold); }
    .guest-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* ── RESULT CARDS ── */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .result-tile {
      border-radius: 12px;
      padding: 18px 14px;
      text-align: center;
    }
    .result-tile.dark { background: var(--dark); }
    .result-tile.light { border: 2px solid var(--border); background: #fff; }
    .result-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .result-tile.dark .result-tag { color: rgba(255,255,255,0.55); }
    .result-tile.light .result-tag { color: var(--text-muted); }
    .result-val { font-size: 30px; font-weight: 900; line-height: 1; }
    .result-tile.dark .result-val { color: #fff; }
    .result-tile.light .result-val { color: var(--dark); }
    .result-sub { font-size: 11px; margin-top: 4px; opacity: 0.55; font-weight: 500; }
    .result-tile.dark .result-sub { color: #fff; }
    .result-tile.light .result-sub { color: var(--text); }

    /* ── SHOPPING LIST ── */
    .ingredient-list { border-top: 1px solid var(--border); }
    .ingredient-row {
      display: flex;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .ingredient-row:last-child { border-bottom: none; }
    .ing-emoji { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
    .ing-name { flex: 1; font-size: 14.5px; color: var(--text); }
    .ing-amount { font-size: 15px; font-weight: 700; color: var(--dark); white-space: nowrap; }
    .ing-main .ing-name { font-weight: 600; }
    .ing-main .ing-amount { color: var(--gold); font-size: 16px; }

    /* ── TIPS ── */
    .tips-box {
      background: #fdf9f0;
      border-radius: 10px;
      border: 1px solid rgba(200,165,90,0.25);
      padding: 14px 16px;
      margin-top: 16px;
    }
    .tips-box h4 {
      font-size: 12px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--gold); margin-bottom: 8px;
    }
    .tips-box ul { list-style: none; padding: 0; }
    .tips-box li {
      font-size: 13px; color: #555; padding: 3px 0 3px 16px;
      position: relative; line-height: 1.5;
    }
    .tips-box li::before { content: '•'; position: absolute; left: 4px; color: var(--gold); }

    /* ── PRINT BUTTON ── */
    .print-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px; background: var(--dark); color: var(--gold);
      border: none; border-radius: 12px; font-size: 14px; font-weight: 700;
      letter-spacing: 0.5px; cursor: pointer; margin-top: 18px;
      transition: opacity 0.2s; font-family: inherit;
    }
    .print-btn:hover { opacity: 0.85; }
    .print-btn svg { flex-shrink: 0; }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: 22px; left: 22px;
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--dark); border: 2px solid var(--gold);
      color: var(--gold); font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35); z-index: 100;
      transition: transform 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .fab:hover { transform: scale(1.1); }
    .fab-tooltip {
      position: fixed; bottom: 86px; left: 14px;
      background: var(--dark); color: var(--gold); font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(200,165,90,0.4);
      white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .fab:hover + .fab-tooltip { opacity: 1; }

    /* ── PRINT ── */
    @media print {
      .fab, .fab-tooltip, .sticky-bar, .print-btn, .type-grid,
      .slider-section, .search-wrap, .cat-tabs { display: none !important; }
      .header { padding: 16px; }
      .card { box-shadow: none !important; border: 1px solid #ddd; margin-bottom: 10px; }
      body { background: #fff; padding: 0; }
      .container { padding: 10px; max-width: 100%; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 400px) {
      .type-grid { grid-template-columns: repeat(2, 1fr); }
      .header h1 { font-size: 22px; }
      .cat-tab { font-size: 10px; padding: 6px 2px; }
    }
  </style>
</head>
<body>

<!-- STICKY BAR -->
<div class="sticky-bar" id="stickyBar">
  <span class="sticky-name" id="stickyName">Hovädzí guláš</span>
  <span class="sticky-info" id="stickyInfo">15 hostí · 10 L</span>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-tag">🫕 Kotlík na guláš</div>
  <h1><span>Gulášová </span>Kalkulačka</h1>
  <p>Presné množstvá surovín pre každý počet hostí</p>
</div>

<div class="container">

  <!-- TYP GULÁŠU -->
  <div class="card">
    <div class="card-title">🍽 Typ gulášu</div>

    <!-- SEARCH -->
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" class="search-input" id="recipeSearch"
             placeholder="Hľadať recept..." autocomplete="off" spellcheck="false">
    </div>

    <!-- KATEGÓRIE -->
    <div class="cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="all">🍽 Všetky</button>
      <button class="cat-tab" data-cat="gulas">🥩 Guláše</button>
      <button class="cat-tab" data-cat="polievka">🍲 Polievky</button>
      <button class="cat-tab" data-cat="medzinarodne">🌍 Svet</button>
    </div>

    <div class="type-grid" id="typeGrid"></div>
  </div>

  <!-- POČET HOSTÍ -->
  <div class="card slider-section">
    <div class="guest-row">
      <span class="guest-label">Počet hostí:</span>
      <span class="guest-display" id="guestDisplay">15</span>
    </div>
    <input type="range" id="guestSlider" min="1" max="150" value="15" step="1">
    <div class="guest-controls">
      <button class="counter-btn" id="btnMinus" aria-label="Menej">−</button>
      <input type="number" class="guest-num-input" id="guestInput" min="1" max="999" value="15">
      <button class="counter-btn" id="btnPlus" aria-label="Viac">+</button>
    </div>
    <p class="guest-hint">Posuvník 1–150 · zadajte ľubovoľné číslo do políčka</p>
  </div>

  <!-- VÝSLEDKY -->
  <div class="card">
    <div class="results-grid">
      <div class="result-tile dark">
        <div class="result-tag">🫕 Kotlík</div>
        <div class="result-val" id="potSize">10 L</div>
        <div class="result-sub">odporúčaná veľkosť</div>
      </div>
      <div class="result-tile light">
        <div class="result-tag" id="meatTag">🥩 Glejka</div>
        <div class="result-val" id="meatVal">3.4 kg</div>
        <div class="result-sub" id="meatSub">množstvo mäsa</div>
      </div>
    </div>
  </div>

  <!-- NÁKUPNÝ ZOZNAM -->
  <div class="card">
    <div class="card-title">🛒 Nákupný zoznam</div>
    <div class="ingredient-list" id="ingredientList"></div>
    <div class="tips-box" id="tipsBox"></div>
    <button class="print-btn" onclick="window.print()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      Vytlačiť nákupný zoznam
    </button>
  </div>

</div><!-- /container -->

<button class="fab" id="fab" title="Na začiatok">🧮</button>
<div class="fab-tooltip">Gulášová kalkulačka</div>

<script>

/* Kategórie — badge texty pre tlačidlá */
const CAT_BADGE = {
  gulas:        'guláš',
  polievka:     'polievka',
  medzinarodne: 'svet',
};

const POT_SIZES = [5, 10, 15, 20, 30, 40, 60, 80, 100];

/* ── STATE ── */
let currentType = 'hovadzi';
let guests      = 15;
let activeCat   = 'all';
let searchQuery = '';

/* ── HELPERS ── */
function getPotSize(n) {
  const needed = (n / 15) * 10;
  return POT_SIZES.find(s => s >= needed - 0.01) || 100;
}

function fmt(value, unit, noConvert) {
  if (unit === 'ks') return Math.ceil(value) + ' ks';
  if (!noConvert && unit === 'g'  && value >= 1000) return (value / 1000).toFixed(1) + ' kg';
  if (!noConvert && unit === 'ml' && value >= 1000) return (value / 1000).toFixed(1) + ' L';
  return Math.round(value) + ' ' + unit;
}

function getMeatTotal(recipe, n) {
  const main = recipe.ingredients.find(i => i.main);
  if (!main) return '—';
  if (recipe.name === 'Vegán guláš') {
    const total = recipe.ingredients.filter(i => i.isVeg || i.main).reduce((s, i) => s + i.per * n, 0);
    return fmt(total, 'g');
  }
  return fmt(main.per * n, main.unit);
}

/* Normalizácia — odstráni diakritiku pre vyhľadávanie */
function norm(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

/* ── FILTER ── */
function filteredKeys() {
  const q = norm(searchQuery.trim());
  return Object.entries(RECIPES)
    .filter(([, r]) => {
      const catOk  = activeCat === 'all' || r.cat === activeCat;
      const nameOk = !q || norm(r.name).includes(q);
      return catOk && nameOk;
    })
    .map(([k]) => k);
}

/* ── RENDER VÝSLEDKY ── */
function render() {
  const r   = RECIPES[currentType];
  const pot = getPotSize(guests);

  document.getElementById('guestDisplay').textContent = guests;
  document.getElementById('potSize').textContent      = pot + ' L';
  document.getElementById('meatTag').textContent      = r.meatTag;
  document.getElementById('meatVal').textContent      = getMeatTotal(r, guests);
  document.getElementById('meatSub').textContent      = r.meatSub;

  const pct = Math.min(((guests - 1) / 149) * 100, 100).toFixed(2);
  document.getElementById('guestSlider').style.setProperty('--fill', pct + '%');
  document.getElementById('guestSlider').value = Math.min(guests, 150);

  document.getElementById('stickyName').textContent = r.emoji + ' ' + r.name;
  document.getElementById('stickyInfo').textContent = guests + ' hostí · ' + pot + ' L';

  document.getElementById('ingredientList').innerHTML = r.ingredients.map(ing => {
    const total  = ing.per * guests;
    const amount = ing.isCount ? fmt(total, 'ks') : fmt(total, ing.unit, ing.noConvert);
    return `<div class="${ing.main ? 'ingredient-row ing-main' : 'ingredient-row'}">
      <span class="ing-emoji">${ing.emoji}</span>
      <span class="ing-name">${ing.name}</span>
      <span class="ing-amount">${amount}</span>
    </div>`;
  }).join('');

  document.getElementById('tipsBox').innerHTML =
    '<h4>💡 Tip od kuchára</h4><ul>' +
    r.tips.map(t => `<li>${t}</li>`).join('') + '</ul>';
}

/* ── RENDER GRID RECEPTOV ── */
function buildGrid() {
  const grid = document.getElementById('typeGrid');
  const keys = filteredKeys();

  if (keys.length === 0) {
    grid.innerHTML = `<div class="no-results"><span>🔍</span>Žiadne recepty nenájdené</div>`;
    return;
  }

  // Ak aktuálny recept nie je vo filtri, prepneme na prvý
  if (!keys.includes(currentType)) {
    currentType = keys[0];
    render();
  }

  grid.innerHTML = keys.map(key => {
    const r = RECIPES[key];
    return `<button class="type-btn${key === currentType ? ' active' : ''}" data-key="${key}">
      <span class="type-emoji">${r.emoji}</span>${r.name}
      <span class="type-btn-cat">${CAT_BADGE[r.cat] || ''}</span>
    </button>`;
  }).join('');

  // Jeden event listener na celý grid (event delegation)
  grid.onclick = e => {
    const btn = e.target.closest('.type-btn');
    if (!btn) return;
    currentType = btn.dataset.key;
    grid.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b === btn));
    render();
  };
}

/* ── CATEGORY TABS ── */
document.getElementById('catTabs').addEventListener('click', e => {
  const tab = e.target.closest('.cat-tab');
  if (!tab) return;
  activeCat = tab.dataset.cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t === tab));
  buildGrid();
});

/* ── SEARCH ── */
document.getElementById('recipeSearch').addEventListener('input', e => {
  searchQuery = e.target.value;
  buildGrid();
});

/* ── GUESTS ── */
function setGuests(n) {
  guests = Math.max(1, Math.min(999, Math.round(Number(n)) || 1));
  document.getElementById('guestInput').value = guests;
  render();
}

document.getElementById('guestSlider').addEventListener('input', e => setGuests(e.target.value));
document.getElementById('guestInput').addEventListener('change', e => setGuests(e.target.value));
document.getElementById('guestInput').addEventListener('blur',   e => setGuests(e.target.value || guests));
document.getElementById('btnMinus').addEventListener('click', () => setGuests(guests - 1));
document.getElementById('btnPlus').addEventListener('click',  () => setGuests(guests + 1));

/* ── STICKY + FAB ── */
window.addEventListener('scroll', () => {
  document.getElementById('stickyBar').classList.toggle('show', window.scrollY > 160);
}, { passive: true });

document.getElementById('fab').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ── INIT ── */
buildGrid();
render();

/* ══════════════════════════════════════════════════════════
   AUTO-RESIZE PRE IFRAME EMBED (mobile fix)
   Posiela výšku stránky do parent okna cez postMessage.
   Parent iframe potom nastaví svoju výšku podľa obsahu —
   žiadny scroll vnútri iframu, žiadny mobile problém.
══════════════════════════════════════════════════════════ */
(function () {
  if (window.parent === window) return; // nie sme v iframi

  var lastH = 0;

  function sendHeight() {
    var h = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight,
      document.body.offsetHeight,
      document.documentElement.offsetHeight
    );
    if (h !== lastH) {
      lastH = h;
      window.parent.postMessage({ type: 'gk-resize', height: h }, '*');
    }
  }

  // Sleduj zmeny veľkosti obsahu
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(sendHeight).observe(document.body);
  }

  // Záloha: interval pre staré prehliadače
  setInterval(sendHeight, 400);

  // Prvé odoslanie po načítaní
  window.addEventListener('load', sendHeight);
  sendHeight();
})();
</script>
